<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky_Chess - Шахматы с кубиком</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Главное меню -->
    <div id="mainMenu" class="menu-container">
        <div class="menu-content">
            <h1 class="menu-title">🎲 Lucky_Chess 🎲</h1>
            
            <div class="menu-buttons">
                <button onclick="startGame('local')" class="menu-button">
                    <span class="button-icon">👥</span>
                    <span class="button-text">Играть с другом</span>
                    <span class="button-description">На одном экране</span>
                </button>
                
                <button onclick="showBotMenu()" class="menu-button">
                    <span class="button-icon">🤖</span>
                    <span class="button-text">Играть с ботом</span>
                    <span class="button-description">Выберите сложность</span>
                </button>
                
                <button onclick="showOnlineComingSoon()" class="menu-button">
                    <span class="button-icon">🌐</span>
                    <span class="button-text">Играть онлайн</span>
                    <span class="button-description">По сети</span>
                </button>
            </div>
            
            <!-- Цветная шапка создателя внизу -->
            <div class="creator-badge creator-badge-bottom">
                <span class="creator-label">Создатель:</span>
                <span class="creator-name">Nebo</span>
                <span class="creator-copyright">© 2024 Все права защищены</span>
            </div>
            
            <div class="menu-footer">
                <p>Создано с ❤️ by <strong>Nebo</strong></p>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно для уведомлений -->
    <div id="notificationModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🌐</div>
            <h2 class="modal-title" id="modalTitle">Онлайн режим</h2>
            <p class="modal-message" id="modalMessage">Еще не добавлена 😓</p>
            <button onclick="closeModal()" class="modal-button">Понятно</button>
        </div>
    </div>
    
    <!-- Меню выбора сложности бота -->
    <div id="botMenu" class="menu-container" style="display: none;">
        <div class="menu-content">
            <h1 class="menu-title">🤖 Выбор сложности</h1>
            
            <div class="menu-buttons">
                <button onclick="startGame('bot', 'Жыргей')" class="menu-button bot-difficulty">
                    <span class="button-icon">🦆</span>
                    <span class="button-text">Жыргей</span>
                    <span class="button-description">Средние шахматы, кубик всегда меньше 50</span>
                </button>
                
                <button onclick="startGame('bot', 'Легкий')" class="menu-button bot-difficulty">
                    <span class="button-icon">🐣</span>
                    <span class="button-text">Легкий</span>
                    <span class="button-description">Случайные ходы, обычный кубик</span>
                </button>
                
                <button onclick="startGame('bot', 'Средний')" class="menu-button bot-difficulty">
                    <span class="button-icon">🐥</span>
                    <span class="button-text">Средний</span>
                    <span class="button-description">Немного думает, обычный кубик</span>
                </button>
                
                <button onclick="startGame('bot', 'Сложный')" class="menu-button bot-difficulty">
                    <span class="button-icon">🦅</span>
                    <span class="button-text">Сложный</span>
                    <span class="button-description">Хорошие ходы, обычный кубик</span>
                </button>
                
                <button onclick="startGame('bot', 'Extreme')" class="menu-button bot-difficulty">
                    <span class="button-icon">🔥</span>
                    <span class="button-text">Extreme</span>
                    <span class="button-description">Отличные ходы, кубик чаще хороший</span>
                </button>
                
                <button onclick="startGame('bot', 'Reinhard')" class="menu-button bot-difficulty">
                    <span class="button-icon">👑</span>
                    <span class="button-text">Reinhard</span>
                    <span class="button-description">Легендарный, кубик всегда больше 80</span>
                </button>
            </div>
            
            <button onclick="returnToMainMenu()" class="back-button">← Назад</button>
        </div>
    </div>
    
    <!-- Игровой экран -->
    <div id="gameScreen" class="game-container" style="display: none;">
        <h1>🎲 Lucky_Chess 🎲</h1>
        
        <!-- Индикатор текущего игрока -->
        <div class="turn-indicator">
            <div id="whitePlayer" class="player-turn active">
                <div class="player-avatar">♔</div>
                <div class="player-info-text">
                    <span class="player-title">Белые</span>
                    <span class="turn-status">Ваш ход!</span>
                </div>
            </div>
            
            <div class="vs-text">VS</div>
            
            <div id="blackPlayer" class="player-turn">
                <div class="player-avatar">♚</div>
                <div class="player-info-text">
                    <span class="player-title">Чёрные</span>
                    <span class="turn-status">Ожидание</span>
                </div>
            </div>
        </div>
        
        <!-- Информация о фигурах -->
        <div class="pieces-info">
            <div class="pieces-count">
                <span class="pieces-label">Белые фигуры:</span>
                <span id="whitePieces" class="pieces-number">16</span>
            </div>
            <div class="pieces-count">
                <span class="pieces-label">Чёрные фигуры:</span>
                <span id="blackPieces" class="pieces-number">16</span>
            </div>
        </div>
        
        <!-- Съеденные фигуры -->
        <div class="captured-info">
            <div class="captured-pieces">
                <span class="captured-label">Съеденные белые:</span>
                <span id="whiteCaptured" class="captured-list"></span>
            </div>
            <div class="captured-pieces">
                <span class="captured-label">Съеденные чёрные:</span>
                <span id="blackCaptured" class="captured-list"></span>
            </div>
        </div>
        
        <!-- Кубик -->
        <div class="dice-container">
            <button id="rollDice" class="dice-button">🎲 Бросить кубик (1-99)</button>
            <div id="diceResult" class="dice-result">-</div>
            <div id="diceEffect" class="dice-effect"></div>
        </div>
        
        <!-- Игровое поле -->
        <div class="board-wrapper">
            <div id="board" class="board"></div>
        </div>
        
        <!-- Сообщения -->
        <div id="message" class="message">Ход белых. Бросьте кубик!</div>
        
        <!-- Кнопка возврата в меню -->
        <button onclick="returnToMainMenu()" class="back-button">← Вернуться в меню</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
